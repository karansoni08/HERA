<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HERA — Threat Detection Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --nav-h:     54px;
      --bg:        #060912;
      --surface:   #0d1117;
      --surface2:  #131c27;
      --border:    #1e2d3d;
      --border2:   #243447;
      --red:       #f87171;
      --red-dim:   #7f1d1d;
      --orange:    #fb923c;
      --orange-dim:#7c2d12;
      --green:     #4ade80;
      --green-dim: #14532d;
      --blue:      #60a5fa;
      --blue-dim:  #1e3a5f;
      --purple:    #c084fc;
      --purple-dim:#4a1d96;
      --text:      #e2e8f0;
      --text2:     #94a3b8;
      --text3:     #64748b;
      --radius:    10px;
      --radius-sm: 6px;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }

    /* ── NAV ── */
    nav {
      height: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .logo { font-size: 18px; font-weight: 800; letter-spacing: 3px; color: var(--blue); }
    .logo em { color: var(--red); font-style: normal; }
    .status-pill { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--green); font-weight: 500; }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green); box-shadow: 0 0 6px var(--green);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .last-update { color: var(--text3); font-size: 11px; }

    /* ── BODY BELOW NAV ── */
    .page {
      height: calc(100vh - var(--nav-h));
      padding: 18px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: hidden;
    }

    /* ── STAT CARDS ── */
    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; flex-shrink: 0; }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      position: relative;
      overflow: hidden;
    }
    .stat-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    }
    .stat-card.blue::before  { background: var(--blue); }
    .stat-card.orange::before{ background: var(--orange); }
    .stat-card.red::before   { background: var(--red); }
    .stat-card.green::before { background: var(--green); }
    .stat-label { color: var(--text3); font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600; }
    .stat-value { font-size: 34px; font-weight: 700; margin-top: 4px; line-height: 1; }
    .stat-card.blue   .stat-value { color: var(--blue); }
    .stat-card.orange .stat-value { color: var(--orange); }
    .stat-card.red    .stat-value { color: var(--red); }
    .stat-card.green  .stat-value { color: var(--green); }

    /* ── TWO COLUMNS ── */
    .two-col {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 16px;
    }

    /* ── PANEL ── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden; /* clips border-radius */
      min-height: 0;
    }
    .panel-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text3);
      background: var(--surface);
    }
    .count-badge {
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 10px;
      padding: 1px 9px;
      font-size: 11px;
      color: var(--text2);
      font-weight: 600;
    }

    /* ── EVENT FEED SCROLL ── */
    .scroll-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }
    .scroll-area::-webkit-scrollbar { width: 5px; }
    .scroll-area::-webkit-scrollbar-track { background: transparent; }
    .scroll-area::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
    .scroll-area::-webkit-scrollbar-thumb:hover { background: var(--text3); }

    /* ── EVENT ROWS ── */
    .event-row {
      display: grid;
      grid-template-columns: 58px 65px 110px 1fr 38px 44px;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      border-bottom: 1px solid var(--border);
      transition: background .12s;
    }
    .event-row:last-child { border-bottom: none; }
    .event-row:hover { background: var(--surface2); }
    .ev-time   { color: var(--text3); font-size: 11px; font-variant-numeric: tabular-nums; }
    .ev-user   { font-weight: 700; font-size: 12px; }
    .ev-action { color: var(--text2); font-size: 12px; }
    .ev-loc    { color: var(--text3); font-size: 11px; }
    .ev-score  { font-weight: 700; font-size: 12px; font-variant-numeric: tabular-nums; text-align: right; }
    .risk-badge {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 2px 6px; border-radius: 8px;
      font-size: 10px; font-weight: 700; letter-spacing: .4px;
    }
    .risk-safe   { background: var(--green-dim); color: var(--green); }
    .risk-medium { background: var(--orange-dim); color: var(--orange); }
    .risk-high   { background: var(--red-dim); color: var(--red); }

    /* ── ALERT CARDS ── */
    .alerts-inner {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .alert-card {
      border-radius: var(--radius);
      border: 1px solid var(--border2);
      overflow: hidden;
      background: var(--surface2);
    }
    .alert-card.critical { border-color: #7f1d1d; }
    .alert-card.medium   { border-color: #7c2d12; }

    .alert-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; gap: 10px;
      font-weight: 700; font-size: 13px;
    }
    .alert-card.critical .alert-topbar { background: rgba(127,29,29,.45); color: var(--red); }
    .alert-card.medium   .alert-topbar { background: rgba(124,45,18,.45); color: var(--orange); }
    .alert-topbar-left  { display: flex; align-items: center; gap: 7px; }
    .alert-topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .conf-badge {
      background: rgba(255,255,255,.07);
      border-radius: 20px; padding: 2px 9px;
      font-size: 11px; font-weight: 600; color: var(--text2);
    }
    .alert-ts { font-size: 11px; color: var(--text3); font-weight: 500; }

    .alert-body { padding: 14px; display: flex; flex-direction: column; gap: 12px; }

    .meta-row { display: flex; gap: 18px; flex-wrap: wrap; }
    .meta-item { font-size: 12px; }
    .meta-item .key { color: var(--text3); margin-right: 4px; }
    .meta-item .val { color: var(--text); font-weight: 600; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      background: var(--blue-dim); color: var(--blue);
      border: 1px solid rgba(96,165,250,.2);
      border-radius: 20px; padding: 3px 10px;
      font-size: 11px; font-weight: 600;
    }

    .section-label {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1.2px;
      color: var(--text3); margin-bottom: 7px;
    }

    /* actions grid */
    .actions-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .action-block { background: #080c14; border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 10px 12px; }

    .bullet-list { list-style: none; display: flex; flex-direction: column; gap: 5px; }
    .bullet-list li { display: flex; gap: 6px; font-size: 12px; color: #a0b8d0; line-height: 1.5; }
    .bullet-list li::before { content: '›'; color: var(--green); font-weight: 700; flex-shrink: 0; }

    /* ── VICAR ── */
    .vicar-section { background: #080c14; border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 12px 14px; }
    .vicar-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .vicar-card { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; }
    .vicar-card.full { grid-column: 1 / -1; }
    .vicar-head { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
    .vicar-badge {
      font-size: 10px; font-weight: 800;
      width: 20px; height: 20px; border-radius: 5px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .v-v .vicar-badge { background: var(--purple-dim); color: var(--purple); }
    .v-i .vicar-badge { background: var(--red-dim);    color: var(--red); }
    .v-c .vicar-badge { background: var(--orange-dim); color: var(--orange); }
    .v-a .vicar-badge { background: var(--blue-dim);   color: var(--blue); }
    .v-r .vicar-badge { background: var(--green-dim);  color: var(--green); }
    .vicar-name { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text3); }
    .vicar-text { font-size: 12px; color: #a8bdd4; line-height: 1.6; }

    /* ── AI REASONING ── */
    .reasoning-block {
      background: #080c14;
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
    }
    .reasoning-sections { display: flex; flex-direction: column; gap: 12px; }
    .r-title {
      font-size: 11px; font-weight: 700;
      color: var(--blue); text-transform: uppercase; letter-spacing: .8px;
      margin-bottom: 5px;
      display: flex; align-items: center; gap: 6px;
    }
    .r-title::before {
      content: ''; display: inline-block;
      width: 3px; height: 11px;
      background: var(--blue); border-radius: 2px;
    }
    .r-text { font-size: 13px; color: #c5d5e8; line-height: 1.75; }
    .r-raw  { font-size: 13px; color: #8fa8c8; line-height: 1.75; white-space: pre-wrap; }
    .r-divider { height: 1px; background: var(--border); }

    /* ── EMPTY ── */
    .empty { color: var(--text3); font-size: 12px; text-align: center; padding: 40px 20px; }
  </style>
</head>
<body>

<nav>
  <div class="logo">HER<em>A</em></div>
  <div class="status-pill">
    <div class="dot"></div>
    Monitoring Active
  </div>
  <div class="last-update" id="last-updated">—</div>
</nav>

<div class="page">

  <!-- STAT CARDS -->
  <div class="stats-row">
    <div class="stat-card blue">
      <div class="stat-label">Total Events</div>
      <div class="stat-value" id="stat-events">0</div>
    </div>
    <div class="stat-card orange">
      <div class="stat-label">Anomalies</div>
      <div class="stat-value" id="stat-anomalies">0</div>
    </div>
    <div class="stat-card red">
      <div class="stat-label">Critical Threats</div>
      <div class="stat-value" id="stat-critical">0</div>
    </div>
    <div class="stat-card green">
      <div class="stat-label">Users Monitored</div>
      <div class="stat-value" id="stat-users">0</div>
    </div>
  </div>

  <!-- PANELS -->
  <div class="two-col">

    <!-- LEFT: EVENT FEED -->
    <div class="panel">
      <div class="panel-header">
        Live Event Feed
        <span class="count-badge" id="event-count">0</span>
      </div>
      <div class="scroll-area" id="event-feed">
        <div class="empty">Waiting for events…</div>
      </div>
    </div>

    <!-- RIGHT: ALERTS + VICAR -->
    <div class="panel">
      <div class="panel-header">
        Threat Alerts &amp; VICAR Analysis
        <span class="count-badge" id="alert-count">0</span>
      </div>
      <div class="scroll-area">
        <div class="alerts-inner" id="alert-feed">
          <div class="empty">No threats detected yet.</div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function riskClass(s) {
    return s >= 70 ? 'risk-high' : s >= 50 ? 'risk-medium' : 'risk-safe';
  }

  const RTITLES = [
    'Why This Is Dangerous',
    'Possible Attacker Intent',
    'Escalation Risks',
    'Investigation Priority',
  ];

  function parseReasoning(text) {
    if (!text || text.includes('unavailable')) {
      return `<div class="r-raw">${esc(text || '')}</div>`;
    }
    const parts = text.split(/\n?(?=\d+\.\s)/);
    const sections = [];
    for (const p of parts) {
      const m = p.match(/^(\d+)\.\s+([\s\S]*)/);
      if (m) {
        const idx = parseInt(m[1], 10) - 1;
        sections.push({
          title: RTITLES[idx] || `Section ${m[1]}`,
          body: m[2].replace(/^#+\s.*\n?/gm, '').trim()
        });
      }
    }
    if (!sections.length) return `<div class="r-raw">${esc(text)}</div>`;
    return `<div class="reasoning-sections">${
      sections.map((s, i) => `
        ${i > 0 ? '<div class="r-divider"></div>' : ''}
        <div>
          <div class="r-title">${esc(s.title)}</div>
          <div class="r-text">${esc(s.body)}</div>
        </div>
      `).join('')
    }</div>`;
  }

  function renderVICAR(v) {
    if (!v) return '';
    const remItems = v.remediation.map(r => `<li>${esc(r)}</li>`).join('');
    return `
      <div class="vicar-section">
        <div class="section-label">VICAR — How the Vulnerability Was Exploited</div>
        <div class="vicar-grid">
          <div class="vicar-card v-v">
            <div class="vicar-head"><div class="vicar-badge">V</div><div class="vicar-name">Vector</div></div>
            <div class="vicar-text">${esc(v.vector)}</div>
          </div>
          <div class="vicar-card v-i">
            <div class="vicar-head"><div class="vicar-badge">I</div><div class="vicar-name">Impact</div></div>
            <div class="vicar-text">${esc(v.impact)}</div>
          </div>
          <div class="vicar-card v-c">
            <div class="vicar-head"><div class="vicar-badge">C</div><div class="vicar-name">Cause</div></div>
            <div class="vicar-text">${esc(v.cause)}</div>
          </div>
          <div class="vicar-card v-a">
            <div class="vicar-head"><div class="vicar-badge">A</div><div class="vicar-name">Actor</div></div>
            <div class="vicar-text">${esc(v.actor)}</div>
          </div>
          <div class="vicar-card v-r full">
            <div class="vicar-head"><div class="vicar-badge">R</div><div class="vicar-name">Remediation</div></div>
            <ul class="bullet-list">${remItems}</ul>
          </div>
        </div>
      </div>
    `;
  }

  function renderAlert(a) {
    const cls  = a.severity === 'Critical' ? 'critical' : 'medium';
    const icon = a.severity === 'Critical' ? '🔴' : '🟠';
    const chips = a.indicators.map(i => `<span class="chip">◆ ${esc(i)}</span>`).join('');
    const contain = a.containment.map(c => `<li>${esc(c)}</li>`).join('');
    const mitig   = a.mitigation.map(m => `<li>${esc(m)}</li>`).join('');
    const recov   = a.recovery.map(r => `<li>${esc(r)}</li>`).join('');

    return `
      <div class="alert-card ${cls}">
        <div class="alert-topbar">
          <div class="alert-topbar-left">
            <span>${icon}</span>
            ${esc(a.threat_type)}
          </div>
          <div class="alert-topbar-right">
            <span class="conf-badge">${a.confidence}% confidence</span>
            <span class="alert-ts">${a.timestamp}</span>
          </div>
        </div>

        <div class="alert-body">

          <div class="meta-row">
            <div class="meta-item"><span class="key">Origin</span><span class="val">${esc(a.origin)}</span></div>
            <div class="meta-item"><span class="key">Severity</span><span class="val">${esc(a.severity)}</span></div>
          </div>

          <div>
            <div class="section-label">Indicators</div>
            <div class="chips">${chips}</div>
          </div>

          <div class="actions-grid">
            <div class="action-block">
              <div class="section-label">Containment</div>
              <ul class="bullet-list">${contain}</ul>
            </div>
            <div class="action-block">
              <div class="section-label">Mitigation</div>
              <ul class="bullet-list">${mitig}</ul>
            </div>
            <div class="action-block">
              <div class="section-label">Recovery</div>
              <ul class="bullet-list">${recov}</ul>
            </div>
          </div>

          ${renderVICAR(a.vicar)}

          <div>
            <div class="section-label">AI Reasoning — Autonomous Analysis</div>
            <div class="reasoning-block">
              ${parseReasoning(a.reasoning)}
            </div>
          </div>

        </div>
      </div>
    `;
  }

  async function refresh() {
    try {
      const [stats, events, alerts] = await Promise.all([
        fetch('/api/stats').then(r => r.json()),
        fetch('/api/events').then(r => r.json()),
        fetch('/api/alerts').then(r => r.json()),
      ]);

      document.getElementById('stat-events').textContent    = stats.total_events;
      document.getElementById('stat-anomalies').textContent = stats.anomalies;
      document.getElementById('stat-critical').textContent  = stats.critical;
      document.getElementById('stat-users').textContent     = stats.users_monitored;

      document.getElementById('event-count').textContent = events.length;
      const evFeed = document.getElementById('event-feed');
      evFeed.innerHTML = events.length ? events.map(e => `
        <div class="event-row">
          <span class="ev-time">${e.timestamp}</span>
          <span class="ev-user">${esc(e.user)}</span>
          <span class="ev-action">${esc(e.action)}</span>
          <span class="ev-loc">${esc(e.location)}</span>
          <span class="ev-score" style="color:${e.risk_score>=70?'var(--red)':e.risk_score>=50?'var(--orange)':'var(--green)'}">${e.risk_score}</span>
          <span class="risk-badge ${riskClass(e.risk_score)}">${e.risk_score>=70?'HIGH':e.risk_score>=50?'MED':'OK'}</span>
        </div>
      `).join('') : '<div class="empty">Waiting for events…</div>';

      document.getElementById('alert-count').textContent = alerts.length;
      const alFeed = document.getElementById('alert-feed');
      alFeed.innerHTML = alerts.length
        ? alerts.map(renderAlert).join('')
        : '<div class="empty">No threats detected yet.</div>';

      document.getElementById('last-updated').textContent =
        'Updated ' + new Date().toLocaleTimeString();

    } catch(e) { console.error(e); }
  }

  refresh();
  setInterval(refresh, 3000);
</script>
</body>
</html>
